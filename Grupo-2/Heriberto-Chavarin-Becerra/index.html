
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Only Trade - Compra y Venta</title>
      <link rel="stylesheet" type="text/css" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .product-card img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Only Trade - Compra y Venta</h1>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col">
                <div class="card product-card">
                    <img src="https://gmedia.playstation.com/is/image/SIEPDC/ps5-product-thumbnail-01-en-14sep21?$facebook$" class="card-img-top" alt="PS5">
                    <div class="card-body">
                        <h5 class="card-title">PlayStation 5</h5>
                        <p class="card-text">$8,500 MXN</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card product-card">
                    <img src="https://www.radioshack.com.mx/store/medias/515ftw-90132.jpg?context=bWFzdGVyfHJvb3R8MTQyMDQwfGltYWdlL2pwZWd8YURNekwyZzNOQzg1TWpJNU9URXdNREUyTURNd0x6VXhOV1owZDE4NU1ERXpNaTVxY0djfGIxMjYzMjhmOGI0YjQ1MGViYzc2MWI4ZTVmZTBlMGVlN2NiNmNhNjliZmU1OGY4N2JmOTQ3OTdiYmJkODJkM2I" class="card-img-top" alt="Switch">
                    <div class="card-body">
                        <h5 class="card-title">Nintendo Switch</h5>
                        <p class="card-text">$5,200 MXN</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card product-card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2AR0czkHvWII4ok9yXH3ncTOcpy5X-Qzp1Q&s" class="card-img-top" alt="iPhone">
                    <div class="card-body">
                        <h5 class="card-title">iPhone 13</h5>
                        <p class="card-text">$11,000 MXN</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card product-card">
                    <img src="https://www.mazda.mx/siteassets/mazda-mx/mycos-2025/mazda3-sedan/vlp/versiones/mazda3-sedan-vlp-versiones-i-grand-touring-v1.png" class="card-img-top" alt="Carro">
                    <div class="card-body">
                        <h5 class="card-title">Mazda 3 2018</h5>
                        <p class="card-text">$190,000 MXN</p>
                    </div>
                </div>
            </div>
        </div>
        <hr class="my-5">
        <h2 class="text-center mb-4">Publica tu producto</h2>
        <form class="w-50 mx-auto">
            <div class="mb-3">
                <label class="form-label">Nombre del producto</label>
                <input type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">URL de imagen</label>
                <input type="text" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Publicar</button>
        </form>
    </div>
</body>
</html>
